name: Notify WeCom on new edition

on:
  push:
    branches: [main]
    paths:
      - 'latest.json'
      - 'latest-business.json'
      - 'editions/**'
      - 'business/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send WeCom notifications
        env:
          WECOM_WEBHOOK_TECH:      ${{ secrets.WECOM_WEBHOOK }}
          WECOM_WEBHOOK_BUSINESS:  ${{ secrets.WECOM_WEBHOOK_BUSINESS }}
          WECOM_MENTION_TECH:      ${{ secrets.WECOM_MENTION_TECH }}
          WECOM_MENTION_BUSINESS:  ${{ secrets.WECOM_MENTION_BUSINESS }}
          CHANGED_FILES_PATH:      /tmp/changed.txt
        run: |
          git diff --name-only HEAD~1 HEAD 2>/dev/null > /tmp/changed.txt || true
          echo "=== Changed files ==="
          cat /tmp/changed.txt
          python3 .github/scripts/notify.py
