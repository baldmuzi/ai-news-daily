name: Notify WeCom on new edition

on:
  push:
    branches: [main]
    paths:
      - 'latest.json'
      - 'latest-business.json'
      - 'latest-fitness.json'
      - 'latest-fanka-social.json'
      - 'latest-vivaia.json'
      - 'editions/**'
      - 'business/**'
      - 'fitness/**'
      - 'fanka-social/**'
      - 'vivaia/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send WeCom notifications
        env:
          WECOM_WEBHOOK_TECH:         ${{ secrets.WECOM_WEBHOOK }}
          WECOM_WEBHOOK_BUSINESS:     ${{ secrets.WECOM_WEBHOOK_BUSINESS }}
          WECOM_WEBHOOK_FITNESS:      ${{ secrets.WECOM_WEBHOOK_FITNESS }}
          WECOM_WEBHOOK_FANKA_SOCIAL: ${{ secrets.WECOM_WEBHOOK_FANKA_SOCIAL }}
          WECOM_WEBHOOK_VIVAIA:       ${{ secrets.WECOM_WEBHOOK_VIVAIA }}
          WECOM_MENTION_TECH:         ${{ secrets.WECOM_MENTION_TECH }}
          WECOM_MENTION_BUSINESS:     ${{ secrets.WECOM_MENTION_BUSINESS }}
          WECOM_MENTION_FITNESS:      ${{ secrets.WECOM_MENTION_FITNESS }}
          WECOM_MENTION_FANKA_SOCIAL: ${{ secrets.WECOM_MENTION_FANKA_SOCIAL }}
          WECOM_MENTION_VIVAIA:       ${{ secrets.WECOM_MENTION_VIVAIA }}
          WECOM_MENTION_MSG_TECH:     ${{ secrets.WECOM_MENTION_MSG_TECH }}
          WECOM_MENTION_MSG_BUSINESS: ${{ secrets.WECOM_MENTION_MSG_BUSINESS }}
          WECOM_MENTION_MSG_FITNESS:  ${{ secrets.WECOM_MENTION_MSG_FITNESS }}
          WECOM_MENTION_MSG_FANKA_SOCIAL: ${{ secrets.WECOM_MENTION_MSG_FANKA_SOCIAL }}
          WECOM_MENTION_MSG_VIVAIA:   ${{ secrets.WECOM_MENTION_MSG_VIVAIA }}
          CHANGED_FILES_PATH:         /tmp/changed.txt
          GIT_BEFORE:                 ${{ github.event.before }}
          GIT_AFTER:                  ${{ github.sha }}
        run: |
          # Use the exact commit range from this push event (not HEAD~1 which races with concurrent pushes)
          git diff --name-only "${GIT_BEFORE}" "${GIT_AFTER}" 2>/dev/null > /tmp/changed.txt \
            || git diff --name-only HEAD~1 HEAD 2>/dev/null > /tmp/changed.txt \
            || true
          echo "=== Changed files (${GIT_BEFORE:0:7}..${GIT_AFTER:0:7}) ==="
          cat /tmp/changed.txt
          python3 .github/scripts/notify.py
