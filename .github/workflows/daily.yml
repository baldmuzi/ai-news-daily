name: AI 行业快讯 · 每日自动更新

on:
  schedule:
    # 北京时间每天 08:00、12:00、18:00（UTC +8，所以 UTC 是 00/04/10）
    - cron: '0 0 * * *'   # BJ 08:00
    - cron: '0 4 * * *'   # BJ 12:00
    - cron: '0 10 * * *'  # BJ 18:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 允许 Actions push 到仓库

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # 保留完整 git history（期号统计用）

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WECOM_WEBHOOK:     ${{ secrets.WECOM_WEBHOOK }}
          SITE_BASE_URL:     ${{ vars.SITE_BASE_URL }}
        run: python generate.py

      - name: Commit & push generated files
        run: |
          git config user.name  "AI News Bot"
          git config user.email "bot@github-actions"
          git add index.html editions/
          git diff --cached --quiet || \
            git commit -m "chore: auto update [$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')] BJ" && \
            git push
