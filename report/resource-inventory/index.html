<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网站资源位库存告警 · 告警中心</title>
<meta name="description" content="查看网站资源位库存监控状态与告警记录。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/report.css">
</head>
<body>
<main class="wrap">
  <a class="back-link" href="../"><span aria-hidden="true">←</span> 返回告警中心</a>
  <header class="detail-header">
    <div class="header-label">Inventory Alerts</div>
    <h1>网站资源位库存告警</h1>
    <div class="header-sub">网站资源位关联商品的库存监控与告警记录</div>
  </header>
  <section class="summary" aria-label="监控概况">
    <div class="summary-item"><div class="summary-label">监控状态</div><div class="summary-value pending">待接入自动化</div></div>
    <div class="summary-item"><div class="summary-label">最近检查</div><div class="summary-value">尚未运行</div></div>
    <div class="summary-item"><div class="summary-label">告警记录</div><div class="summary-value">0 条</div></div>
  </section>
  <section class="record-panel" aria-labelledby="records-title">
    <div class="record-heading"><h2 id="records-title">告警记录</h2><span class="record-count">共 0 条</span></div>
    <div class="empty-state">
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      </div>
      <h3>暂无告警记录</h3>
      <p>监控自动化尚未接入，当前还没有运行结果。接入后，这里将展示告警时间、涉及的资源位、商品及库存信息。</p>
    </div>
  </section>
  <footer>
    <p>网站资源位库存告警 · 接入自动化后更新</p>
    <p><a href="../">返回告警中心</a></p>
  </footer>
</main>
</body>
</html>
